version: '3.8'

services:
  backend:
    build: ./backend
    image: varshneysarthak/safeconvert-backend:latest
    ports:
      - "8888:8000"
    volumes:
      - temp_data:/app/temp
    environment:
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/temp}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID}
    image: varshneysarthak/safeconvert-frontend:latest
    ports:
      - "3333:3000"

    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_CLARITY_ID=${NEXT_PUBLIC_CLARITY_ID}

volumes:
  temp_data:
