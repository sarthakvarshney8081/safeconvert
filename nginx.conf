events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # Limit upload size to 20MB
    client_max_body_size 20M;

    server {
        listen 80;

        # Frontend
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Backend API
        # Proxies /api/ requests to the backend container
        # Rewrites /api/v1/resource -> /v1/resource if needed, but our backend mounts at root.
        # Assuming our backend routes are like /pdf/merge, we should proxy specific prefixes or use a path rewrite.
        # Let's map /api/ to internal backend root, stripping /api/ prefix.
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        # Also proxy /docs and /openapi.json for convenience if needed, or put them under /api/docs via backend config.
    }
}
