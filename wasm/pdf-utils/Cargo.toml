[package]
name = "safeconvert-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
lopdf = "0.31.0"
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
image = { version = "0.24", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
console_error_panic_hook = "0.1"


