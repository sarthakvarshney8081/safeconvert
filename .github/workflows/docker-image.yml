version: '3.8'

services:
  backend:
    build: ./backend
    image: varshneysarthak/safeconvert-backend:latest
    container_name: pizza-backend-1
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: always
    # Ports removed for security (gateway internal routing)
    volumes:
      - ./backend:/app
      - temp_data:/app/temp
      - ./backend/logs:/app/logs
    environment:
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/temp}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID}
        - NEXT_PUBLIC_CLARITY_ID=${NEXT_PUBLIC_CLARITY_ID}
    image: varshneysarthak/safeconvert-frontend:latest
    restart: always
    # Ports removed for security (gateway internal routing)
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_CLARITY_ID=${NEXT_PUBLIC_CLARITY_ID}
      - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID}

  gateway:
    build: ./nginx
    image: varshneysarthak/safeconvert-gateway:latest
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend

volumes:
  temp_data:
